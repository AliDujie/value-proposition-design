[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-proposition-design"
version = "2.4.137"
description = "Value Proposition Design toolkit — canvas analysis, experiment design, competitive strategy, prioritization and sample size calculation (价值主张设计工具包 — 画布分析、实验设计、竞争战略、优先级排序与样本量计算)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["value-proposition", "product-market-fit", "business-canvas", "experimentation", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.urls]
Homepage = "https://github.com/AliDujie/value-proposition-design"
Repository = "https://github.com/AliDujie/value-proposition-design"
Issues = "https://github.com/AliDujie/value-proposition-design/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["vpd*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
